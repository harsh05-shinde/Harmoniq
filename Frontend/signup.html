<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Harmoniq</title>
    <link rel="stylesheet" href="loginsignup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <img src="http://127.0.0.1:8000/media/covers/harmoniqlogo.png" alt="Harmoniq Logo" >
            <h2>Sign up for free to start listening</h2>
        </div>

        <form id="signup-form" class="auth-form">
            <div class="input-group">
                <label for="signup-email">Gmail Address</label>
                <input type="email" id="signup-email" name="email" placeholder="name@gmail.com" required>
            </div>

            <div class="input-group">
                <label for="signup-password">Create Password</label>
                <input type="password" id="signup-password" name="password" placeholder="Create a password" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password"
                    required>
            </div>

            <button type="submit" class="auth-btn">Sign Up</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Log in here</a></p>
        </div>
    </div>
    <script src="auth.js"></script>

</body>

</html>
